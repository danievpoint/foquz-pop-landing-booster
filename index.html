    <div id="foquz-preload" aria-hidden="true"></div>
    <script>
      (function(){
        var done=false,isHome=location.pathname==='/'||location.pathname==='';
        function loadKlaviyo(){setTimeout(function(){var k=document.createElement('script');k.async=true;k.src='https://static.klaviyo.com/onsite/js/WE63iq/klaviyo.js';document.head.appendChild(k);},2500);}
        function hide(){if(done)return;done=true;var el=document.getElementById('foquz-preload');if(el){el.classList.add('hide');setTimeout(function(){el.remove()},400);}loadKlaviyo();}
        function viewportImagesDone(){
          var r=document.getElementById('root');if(!r||!r.children.length)return false;
          var nav=document.getElementById('site-navbar');
          var imgs=r.querySelectorAll('img'),content=0;
          for(var i=0;i<imgs.length;i++){if(nav&&nav.contains(imgs[i]))continue;var b=imgs[i].getBoundingClientRect();if(!b.width||b.top>=innerHeight||b.bottom<=0)continue;content++;if(!imgs[i].complete)return false;}
          return content>0;
        }
        if(isHome){window.addEventListener('foquz:hero-ready',function(){requestAnimationFrame(hide)});}
        else{
          var fonts=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
          fonts.then(function(){var t=setInterval(function(){if(document.readyState!=='loading'&&viewportImagesDone()){clearInterval(t);requestAnimationFrame(hide);}},80);});
        }
        setTimeout(hide,4000);
      })();
    </script>
